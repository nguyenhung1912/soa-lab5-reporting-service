spring.application.name=soa-lab5-reporting-service
server.port=8083

spring.datasource.url=jdbc:h2:mem:reportdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

auth.service.url=http://localhost:8080/auth
product.service.url=http://localhost:8081/products
order.service.url=http://localhost:8082

reporting.default.cost-ratio=0.70
